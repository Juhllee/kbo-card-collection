<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="KBO카드"/>
<meta name="theme-color" content="#0f172a"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<title>KBO 카드 컬렉션</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--accent:#38bdf8;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",sans-serif;
 -webkit-font-smoothing:antialiased;}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
a{color:inherit;text-decoration:none;}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 40px;}
header.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
 padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;backdrop-filter:blur(10px);}
header.bar .back{font-size:22px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
 border-radius:10px;background:rgba(255,255,255,.08);}
header.bar h1{font-size:17px;margin:0;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bigtitle{text-align:center;padding:30px 0 8px;}
.bigtitle .t{font-size:26px;font-weight:800;letter-spacing:-.5px;}
.bigtitle .s{color:var(--mut);font-size:13px;margin-top:6px;}
.years{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
.yearbtn{background:linear-gradient(135deg,#1e293b,#0b1220);border:1px solid var(--line);
 border-radius:18px;padding:30px 16px;text-align:center;}
.yearbtn .y{font-size:34px;font-weight:800;}
.yearbtn .c{color:var(--mut);font-size:12px;margin-top:6px;}
.teamgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.teamcard{border-radius:16px;padding:14px;color:#fff;position:relative;overflow:hidden;min-height:96px;
 display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 14px rgba(0,0,0,.3);}
.teamcard .kr{font-size:19px;font-weight:800;}
.teamcard .en{font-size:10.5px;opacity:.85;letter-spacing:.5px;font-weight:600;margin-top:2px;}
.teamcard .pg{font-size:11px;opacity:.95;margin-top:10px;font-variant-numeric:tabular-nums;}
.tbar{height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin-top:5px;overflow:hidden;}
.tbar>i{display:block;height:100%;background:#fff;border-radius:3px;}
.teamhero{border-radius:0 0 18px 18px;padding:16px 16px 18px;color:#fff;margin:0 -14px 14px;}
.teamhero .kr{font-size:24px;font-weight:800;}
.teamhero .en{font-size:12px;opacity:.85;font-weight:600;letter-spacing:.5px;}
.teamhero .ov{margin-top:12px;font-size:12px;display:flex;justify-content:space-between;align-items:center;}
.bigbar{height:8px;border-radius:5px;background:rgba(255,255,255,.25);margin-top:6px;overflow:hidden;}
.bigbar>i{display:block;height:100%;background:#fff;}
.cat{margin-top:18px;}
.cat h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
.cat h2 .badge{font-size:11px;color:var(--mut);font-weight:600;}
.varhdr{display:flex;font-size:11px;color:var(--mut);padding:2px 12px 6px;gap:8px;}
.varhdr .vh{width:54px;text-align:center;flex:none;}
.varhdr .sp{flex:1;}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.row{display:flex;align-items:center;padding:11px 12px;border-top:1px solid var(--line);gap:8px;}
.row:first-child{border-top:none;}
.row .nm{flex:1;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0;}
.row .nm .no{font-size:11px;color:var(--mut);background:var(--card2);border-radius:6px;
 padding:2px 6px;font-variant-numeric:tabular-nums;flex:none;}
.row .nm .note{font-size:10px;color:var(--mut);}
.chk{width:54px;flex:none;display:flex;justify-content:center;}
.box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:transparent;
 display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;transition:.12s;}
.box.on{border-color:transparent;}
.box .ck{opacity:0;transform:scale(.5);transition:.12s;}
.box.on .ck{opacity:1;transform:scale(1);}
.toolbar{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
.toolbar button{background:var(--card2);color:var(--txt);border:1px solid var(--line);
 border-radius:10px;padding:9px 14px;font-size:13px;}
.hint{color:var(--mut);font-size:11.5px;text-align:center;margin-top:24px;line-height:1.6;}
.footer{color:var(--mut);font-size:11px;text-align:center;margin-top:26px;}
.btnlink{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-size:13px;}
.formrow{margin-top:16px;}
.formrow label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;}
.formrow input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--txt);font-size:14px;}
.switch{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;}
.switch input{width:20px;height:20px;}
.note2{color:var(--mut);font-size:12.5px;line-height:1.75;margin-top:16px;}
.status{margin-top:14px;font-size:13px;padding:11px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:#0b1220;border:1px solid var(--line);color:var(--txt);padding:11px 16px;border-radius:12px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:90%;text-align:center;}
</style>
</head>

<div id="app"></div>
<script>
const APP=document.getElementById('app');
const D=window.__DATA__;
const TEAMS=D.teams, DATA=D.data;
const TM={}; TEAMS.forEach(t=>TM[t.k]=t);
const LS='kbocards_v1';
let STATE=JSON.parse(localStorage.getItem(LS)||'{}');
function save(){localStorage.setItem(LS,JSON.stringify(STATE));}
function key(y,t,c,name,no,v){return [y,t,c,(no!=null?no+'_':'')+name,v].join('|');}
function isOn(k){return !!STATE[k];}
function toggle(k){if(STATE[k])delete STATE[k];else STATE[k]=1;save();}

// ---- 구글시트 동기화 ----
let SYNC=JSON.parse(localStorage.getItem('kbocards_sync')||'{}');
function saveSync(){localStorage.setItem('kbocards_sync',JSON.stringify(SYNC));}
function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';},2300);setTimeout(()=>t.remove(),2700);}
function buildPayload(){
  const giveaway=[],want=[];
  ['2025','2026'].forEach(y=>{TEAMS.forEach(tm=>{const t=tm.k;
    (DATA[y][t]||[]).forEach(b=>{b.players.forEach(p=>{b.variants.forEach(v=>{
      const on=isOn(key(y,t,b.cat,p.name,p.no,v));
      const ver=(v==='보유')?'':v;
      const row=[y,t,b.cat,ver,(p.no!=null?p.no:''),p.name];
      if(t==='KIA'){ if(!on) want.push(row); } else { if(on) giveaway.push(row); }
    });});});});});
  return {token:SYNC.token||'',generatedAt:new Date().toISOString(),giveaway,want};
}
let _syncTimer=null;
function scheduleSync(){if(!(SYNC.enabled&&SYNC.url))return;clearTimeout(_syncTimer);_syncTimer=setTimeout(()=>syncNow(true),4000);}
async function syncNow(silent){
  if(!SYNC.url){if(!silent)toast('동기화 설정에서 웹앱 URL을 먼저 입력하세요');return;}
  const payload=buildPayload();
  if(!silent)toast('동기화 중…');
  try{
    const res=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    let msg='전송됨';
    try{const j=await res.json();msg=j.ok?('동기화 완료 · 양도 '+j.giveaway+' / 구함 '+j.want):('오류: '+(j.error||'?'));}catch(e){}
    SYNC.last=new Date().toISOString();saveSync();
    if(!silent)toast(msg);
  }catch(e){if(!silent)toast('전송 실패: '+e);}
}

// progress for a team
function teamStats(y,t){let tot=0,own=0;(DATA[y][t]||[]).forEach(b=>{
  b.players.forEach(p=>{b.variants.forEach(v=>{tot++;
    if(isOn(key(y,t,b.cat,p.name,p.no,v)))own++;});});});return{tot,own};}
function yearStats(y){let tot=0,own=0;TEAMS.forEach(tm=>{const s=teamStats(y,tm.k);tot+=s.tot;own+=s.own;});return{tot,own};}

function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function route(){const h=location.hash.replace(/^#\/?/,'');const parts=h?h.split('/').map(decodeURIComponent):[];
  if(parts[0]==='sync')return viewSync();
  if(parts.length>=2)return viewTeam(parts[0],parts[1]);
  if(parts.length===1&&(parts[0]==='2025'||parts[0]==='2026'))return viewYear(parts[0]);
  return viewHome();}

function viewHome(){
  const s25=yearStats('2025'),s26=yearStats('2026');
  APP.innerHTML=`
  <div class="wrap">
    <div class="bigtitle"><div class="t">⚾ KBO 카드 컬렉션</div>
      <div class="s">SCC · 7-ELEVEN · 연도를 선택하세요</div></div>
    <div class="years">
      <a class="yearbtn" href="#/2026"><div class="y">2026</div><div class="c">${s26.own} / ${s26.tot} 보유</div></a>
      <a class="yearbtn" href="#/2025"><div class="y">2025</div><div class="c">${s25.own} / ${s25.tot} 보유</div></a>
    </div>
    <div class="toolbar" style="justify-content:center;margin-top:16px">
      <a class="btnlink" href="#/sync">☁︎ 구글시트 동기화${(SYNC.enabled&&SYNC.url)?' · 켜짐':''}</a>
    </div>
    <div class="hint">체크하면 보유 표시됩니다. 기록은 이 기기에 자동 저장돼요.<br>
      Safari 공유 → <b>홈 화면에 추가</b> 하면 앱처럼 사용할 수 있습니다.</div>
    <div class="footer">데이터: SCC 2025 / 2026 KBO 컬렉션 체크리스트</div>
  </div>`;
}

function viewSync(){
  APP.innerHTML=`
  <header class="bar"><a class="back" href="#/">‹</a><h1>구글시트 동기화</h1></header>
  <div class="wrap">
   <div class="note2">앱에서 체크한 카드를 <b>구글 시트</b>로 보냅니다 (거래용).<br>
     • <b>양도가능</b> 시트 = 내가 보유한 카드 (KIA 제외)<br>
     • <b>구함</b> 시트 = 내가 모으는 KIA 중 아직 없는 카드</div>
   <div class="formrow"><label>웹앱 URL (Apps Script 배포 주소)</label>
     <input id="su" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(SYNC.url||'')}"></div>
   <div class="formrow"><label>비밀키 (스크립트의 TOKEN과 동일하게)</label>
     <input id="st" type="text" placeholder="예: mysecret123" value="${esc(SYNC.token||'')}"></div>
   <label class="switch"><input id="se" type="checkbox" ${SYNC.enabled?'checked':''}> 체크할 때 자동 전송</label>
   <div class="toolbar">
     <button id="ssave">저장</button>
     <button id="stest">연결 테스트</button>
     <button id="ssync">지금 동기화</button>
   </div>
   <div class="status" id="sstat">${SYNC.last?('마지막 동기화: '+new Date(SYNC.last).toLocaleString()):'아직 동기화한 적 없음'}</div>
   <div class="note2">설정 방법: 저장소의 <b>SETUP_SYNC.md</b> 와 <b>google-apps-script.gs</b> 참고.</div>
  </div>`;
  const $=id=>document.getElementById(id);
  $('ssave').onclick=()=>{SYNC.url=$('su').value.trim();SYNC.token=$('st').value.trim();SYNC.enabled=$('se').checked;saveSync();toast('저장됨');};
  $('stest').onclick=async()=>{const u=$('su').value.trim();if(!u){toast('URL을 입력하세요');return;}toast('테스트 중…');try{const r=await fetch(u);const j=await r.json();toast(j.ok?'연결 OK ✓':('응답: '+JSON.stringify(j)));}catch(e){toast('연결 실패: '+e);}};
  $('ssync').onclick=()=>{SYNC.url=$('su').value.trim();SYNC.token=$('st').value.trim();SYNC.enabled=$('se').checked;saveSync();syncNow(false);};
}

function viewYear(y){
  let cards='';
  TEAMS.forEach(tm=>{const s=teamStats(y,tm.k);
    const pct=s.tot?Math.round(s.own/s.tot*100):0;
    cards+=`<a class="teamcard" style="background:${tm.color};color:${tm.fg}" href="#/${y}/${encodeURIComponent(tm.k)}">
      <div><div class="kr">${tm.k}</div><div class="en">${tm.eng}</div></div>
      <div><div class="pg">${s.own} / ${s.tot} · ${pct}%</div>
      <div class="tbar"><i style="width:${pct}%;background:${tm.fg}"></i></div></div></a>`;});
  APP.innerHTML=`
  <header class="bar"><a class="back" href="#/">‹</a><h1>${y} 시즌 · 구단 선택</h1></header>
  <div class="wrap"><div class="teamgrid">${cards}</div>
  <div class="footer">구단을 선택해 선수별로 체크하세요</div></div>`;
}

function viewTeam(y,t){
  if(!DATA[y]||!DATA[y][t]){location.hash='#/';return;}
  const tm=TM[t]; const blocks=DATA[y][t];
  const s=teamStats(y,t); const pct=s.tot?Math.round(s.own/s.tot*100):0;
  let html=`<header class="bar"><a class="back" href="#/${y}">‹</a><h1>${y} · ${tm.k}</h1></header>
  <div class="wrap">
   <div class="teamhero" style="background:${tm.color};color:${tm.fg}">
     <div class="kr">${tm.k}</div><div class="en">${tm.eng}</div>
     <div class="ov"><span id="ovtxt">${s.own} / ${s.tot} 보유</span><span id="ovpct">${pct}%</span></div>
     <div class="bigbar"><i id="ovbar" style="width:${pct}%;background:${tm.fg}"></i></div>
   </div>`;
  blocks.forEach((b,bi)=>{
    const multi=!(b.variants.length===1&&b.variants[0]==='보유');
    html+=`<div class="cat"><h2>${b.cat}<span class="badge">${b.players.length}명${multi?' · '+b.variants.join('/'):''}</span></h2>`;
    if(multi){html+=`<div class="varhdr"><span class="sp"></span>`+
      b.variants.map(v=>`<span class="vh">${v}</span>`).join('')+`</div>`;}
    html+=`<div class="list">`;
    b.players.forEach(p=>{
      const no=(p.no!=null)?`<span class="no">${p.no}</span>`:'';
      const note=p.note?`<span class="note">(${p.note})</span>`:'';
      let boxes='';
      b.variants.forEach(v=>{const k=key(y,t,b.cat,p.name,p.no,v);
        boxes+=`<span class="chk"><span class="box${isOn(k)?' on':''}" data-k="${esc(k)}" style="${isOn(k)?'background:'+tm.color+';border-color:'+tm.color:''}"><span class="ck">✓</span></span></span>`;});
      html+=`<div class="row"><div class="nm">${no}<span>${esc(p.name)}</span>${note}</div>${boxes}</div>`;
    });
    html+=`</div></div>`;
  });
  html+=`<div class="toolbar">
     <button id="allbtn">전체 체크</button>
     <button id="clrbtn">전체 해제</button>
   </div>
   <div class="footer">탭하면 보유 표시 / 자동 저장</div></div>`;
  APP.innerHTML=html;

  function refreshOv(){const s=teamStats(y,t);const pct=s.tot?Math.round(s.own/s.tot*100):0;
    document.getElementById('ovtxt').textContent=`${s.own} / ${s.tot} 보유`;
    document.getElementById('ovpct').textContent=pct+'%';
    document.getElementById('ovbar').style.width=pct+'%';}
  APP.querySelectorAll('.box').forEach(el=>{
    el.addEventListener('click',()=>{const k=el.getAttribute('data-k');toggle(k);
      const on=isOn(k);el.classList.toggle('on',on);
      el.style.background=on?tm.color:''; el.style.borderColor=on?tm.color:'';
      refreshOv();scheduleSync();});});
  document.getElementById('allbtn').onclick=()=>{blocks.forEach(b=>b.players.forEach(p=>b.variants.forEach(v=>{STATE[key(y,t,b.cat,p.name,p.no,v)]=1;})));save();scheduleSync();viewTeam(y,t);};
  document.getElementById('clrbtn').onclick=()=>{if(!confirm(tm.k+' 체크를 모두 해제할까요?'))return;blocks.forEach(b=>b.players.forEach(p=>b.variants.forEach(v=>{delete STATE[key(y,t,b.cat,p.name,p.no,v)];})));save();scheduleSync();viewTeam(y,t);};
}

window.addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
